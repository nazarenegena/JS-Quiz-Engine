<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>JS Quiz Engine</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
        <link rel="stylesheet" href="css/style.css" />

    </head>
    <body>
        <div id="main">
            <div class="navbar">
                <p class="title"><span id="q-icon">Q</span>Quzily</p>
                <button id="restart-button" class="button" style="display: none">Restart Questions</button>
                <div class="progress-wrapper">
                  <span class="progress-start">01</span>
                  <div class="progress-track">
                    <div id="progress-fill"></div>
                  </div>
                  <span id="progress-end">21</span>
                </div>
            </div>

            <div class="content">
                <div class="content-navbar">
                      <p class="question-number"></p>
                        <p class="question-difficulty"></p>
                </div>
<!--<p style="color: red">Note: Styling the End of questions view</p>-->
                <!--Quiz section-->
                <div id="all-questions"></div>
                <div class="answer-container">
                    <p id="score"></p>
                    <button id="next-button" class="button" style="display: none">Next Question</button>
                    <button id="finish-button" class="button" style="display: none">Finish Question</button>
                </div>
                <!--End of question-->
                <div class="end-of-questions">

                </div>
            </div>

        </div>

        <script type="module" src="js/app.js"></script>
    </body>
</html>
