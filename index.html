<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>JS Quiz Engine</title>
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body>
        <div id="main">
            <div class="navbar">
                <span><span id="q-icon">Q</span>Quzily</span>
                <div id="progress-wrapper">
                  <span id="progress-start">01</span>
                  <div id="progress-track">
                    <div id="progress-fill"></div>
                  </div>
                  <span id="progress-end">21</span>
                </div>
            </div>

            <!--Quiz section-->
            <div id="all-questions"></div>

            <div class="answer-container">
                <p id="score"></p>
            </div>
            <!--End of question-->
            <div id="end-of-questions"></div>
        </div>

        <script type="module" src="js/app.js"></script>
    </body>
</html>
